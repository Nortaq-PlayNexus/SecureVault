name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore SecureVault.sln

      - name: Run tests
        run: dotnet test tests\SecureVault.Tests\SecureVault.Tests.csproj -c Release

      - name: Publish single-file (win-x64, self-contained)
        run: |
          dotnet publish src\SecureVault.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish\win-x64

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          Get-FileHash publish\win-x64\SecureVault.exe -Algorithm SHA256 |
            Select-Object -ExpandProperty Hash > publish\win-x64\SecureVault.exe.sha256

      # Optional code signing: uncomment and configure secrets to sign artifacts.
      # - name: Sign executable
      #   if: ${{ secrets.CODE_SIGNING_CERT != '' }}
      #   run: |
      #     $cert = [Convert]::FromBase64String("${{ secrets.CODE_SIGNING_CERT }}")
      #     [IO.File]::WriteAllBytes("$env:TEMP\sign.pfx", $cert)
      #     signtool sign /f "$env:TEMP\sign.pfx" /p "${{ secrets.CODE_SIGNING_PASSWORD }}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish\win-x64\SecureVault.exe

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: publish/win-x64/*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/win-x64/SecureVault.exe
            publish/win-x64/SecureVault.exe.sha256
          generate_release_notes: true
