name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore SecureVault.sln

      - name: Verify formatting
        run: dotnet format SecureVault.sln --verify-no-changes --no-restore

      - name: Build (Debug)
        run: dotnet build SecureVault.sln -c Debug --no-restore

      - name: Build (Release, warnings-as-errors)
        run: dotnet build SecureVault.sln -c Release --no-restore

      - name: Test (Debug)
        run: dotnet test tests\SecureVault.Tests\SecureVault.Tests.csproj -c Debug --no-build --logger "trx;LogFileName=debug.trx"

      - name: Test (Release)
        run: dotnet test tests\SecureVault.Tests\SecureVault.Tests.csproj -c Release --no-build --logger "trx;LogFileName=release.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
