name: Feature request
description: Suggest an idea for SecureVault.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please check the [ROADMAP](../../ROADMAP.md) first —
        the issue may already be planned or deliberately out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Why is the current behaviour insufficient?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature as concretely as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else have you tried, and why did it fall short?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy impact
      description: Does this feature touch secrets, networking, or data leaving the device?
      options:
        - label: It sends data off-device (explain in the description)
        - label: It changes storage or backup/sync format
        - label: No privacy impact
    validations:
      required: true
